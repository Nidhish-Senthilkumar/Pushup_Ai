<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Push-Up AI Trainer</title>
    <link rel="stylesheet" href="Styles_AI.css" />
  </head>
  <body>
    <div class="container">
      <div class="camera-section">
        <h2>Camera View</h2>
        <div class="camera-box">
          <video
            id="input_video"
            class="camera-video"
            autoplay
            playsinline
          ></video>
          <canvas
            id="overlay"
            style="
              position: absolute;
              left: 0;
              top: 0;
              pointer-events: none;
              display: none;
            "
          ></canvas>
          <div id="countdownOverlay" class="countdown"></div>
          <div class="camera-controls">
            <button id="startRecording" class="btn" type="button" disabled>
              Loading Model...
            </button>
            <div id="recordStatus" class="record-status">Loading AI model...</div>
          </div>
        </div>
      </div>

      <div class="feedback-panel">
        <h2 class="title">AI Coach</h2>

        <div id="aiTip" class="tip">Record A Pushup!</div>

        <div class="status">
          <p><strong>Push-ups:</strong> <span id="pushupCount">0</span></p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="websitejavascript.js"></script>
  </body>
</html>
