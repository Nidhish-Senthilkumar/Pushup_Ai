<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Push-Up AI Trainer</title>
    <link rel="stylesheet" href="Styles_AI.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-brand">Push-Up Trainer</div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="trainer.html" class="active">AI Trainer</a></li>
          <li><a href="stats.html">Stats</a></li>
        </ul>
      </div>
    </nav>

    <div class="container">
      <div class="camera-section">  
        <h2>Camera View</h2>
        <div class="camera-box">
          <video
            id="input_video"
            class="camera-video"
            autoplay
            playsinline
          ></video>
          <canvas id="overlay"></canvas>
          <div id="countdownOverlay" class="countdown"></div>
          <div class="camera-controls">
            <button id="startRecording" class="btn" type="button" disabled>
              Loading Model...
            </button>
          </div>
        </div>
      </div>

      <div class="feedback-panel">
        <h2 class="title">AI Coach</h2>
        <div id="recordStatus" class="tip">Record A Pushup!</div>
        <div class="status">
          <p id="aifeedback">Your Feedback Will Appear Here!</p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="websitejavascript.js"></script>
  </body>
</html>
