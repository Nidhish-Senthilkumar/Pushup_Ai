# Builds Cadence (spotter/) and publishes a mirror to GitHub Pages. The main site, getcadence.cc, is on Cloudflare (see spotter/HANDOFF.md).
# One-time setup by a repo admin: Settings → Pages → Source: "GitHub Actions".
name: Deploy GitHub Pages mirror

on:
  push:
    branches: [main]
    paths: ["spotter/**", ".github/workflows/spotter-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spotter/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spotter/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
